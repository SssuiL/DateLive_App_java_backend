spring.application.name=manliao-backend
server.port=${JAVA_API_PORT:8200}
server.address=${JAVA_API_BIND:127.0.0.1}
spring.datasource.url=${JAVA_DATABASE_URL:jdbc:postgresql://127.0.0.1:15433/manliao_java}
spring.datasource.username=${JAVA_DATABASE_USER:manliao_java}
spring.datasource.password=${JAVA_DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.auth.jwt-secret=${JAVA_JWT_SECRET:}
app.auth.legacy-registration-enabled=${JAVA_LEGACY_REGISTRATION_ENABLED:false}

app.sms.provider=${JAVA_SMS_PROVIDER:disabled}
app.sms.return-dev-code=${JAVA_SMS_RETURN_DEV_CODE:false}
app.sms.code-secret=${JAVA_SMS_CODE_SECRET:}
app.admin.bootstrap-enabled=${JAVA_ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap-username=${JAVA_ADMIN_BOOTSTRAP_USERNAME:}
app.admin.bootstrap-password=${JAVA_ADMIN_BOOTSTRAP_PASSWORD:}
app.accounts.worker-enabled=${JAVA_ACCOUNT_ERASURE_ENABLED:true}

app.media.ffmpeg=${JAVA_MEDIA_FFMPEG:}
app.media.ffprobe=${JAVA_MEDIA_FFPROBE:}
app.media.jobs-worker-enabled=${JAVA_MEDIA_JOBS_WORKER_ENABLED:true}
app.media.draft-worker-enabled=${JAVA_MEDIA_DRAFT_WORKER_ENABLED:true}
app.media.draft-retention-hours=${JAVA_MEDIA_DRAFT_RETENTION_HOURS:24}
app.groups.public-base-url=${JAVA_GROUP_PUBLIC_BASE_URL:http://127.0.0.1:8200}
