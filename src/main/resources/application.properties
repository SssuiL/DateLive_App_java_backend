spring.application.name=manliao-backend
server.port=${JAVA_API_PORT:8200}
server.address=${JAVA_API_BIND:127.0.0.1}
spring.datasource.url=${JAVA_DATABASE_URL:jdbc:postgresql://127.0.0.1:15433/manliao_java}
spring.datasource.username=${JAVA_DATABASE_USER:manliao_java}
spring.datasource.password=${JAVA_DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.auth.jwt-secret=${JAVA_JWT_SECRET:}
app.auth.legacy-registration-enabled=${JAVA_LEGACY_REGISTRATION_ENABLED:false}

app.sms.provider=${JAVA_SMS_PROVIDER:disabled}
app.sms.return-dev-code=${JAVA_SMS_RETURN_DEV_CODE:false}
app.sms.code-secret=${JAVA_SMS_CODE_SECRET:}
app.admin.bootstrap-enabled=${JAVA_ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap-username=${JAVA_ADMIN_BOOTSTRAP_USERNAME:}
app.admin.bootstrap-password=${JAVA_ADMIN_BOOTSTRAP_PASSWORD:}
app.accounts.worker-enabled=${JAVA_ACCOUNT_ERASURE_ENABLED:true}

app.media.ffmpeg=${JAVA_MEDIA_FFMPEG:}
app.media.ffprobe=${JAVA_MEDIA_FFPROBE:}
app.media.jobs-worker-enabled=${JAVA_MEDIA_JOBS_WORKER_ENABLED:true}
app.media.draft-worker-enabled=${JAVA_MEDIA_DRAFT_WORKER_ENABLED:true}
app.media.draft-retention-hours=${JAVA_MEDIA_DRAFT_RETENTION_HOURS:24}
app.groups.public-base-url=${JAVA_GROUP_PUBLIC_BASE_URL:http://127.0.0.1:8200}

app.environment=${JAVA_APP_ENV:production}
app.billing.dev-recharge-enabled=${JAVA_DEV_RECHARGE_ENABLED:false}

app.payments.provider=${JAVA_PAYMENT_PROVIDER:disabled}
app.payments.mock-enabled=${JAVA_PAYMENT_MOCK_ENABLED:false}
app.payments.callback-secret=${JAVA_PAYMENT_CALLBACK_SECRET:}
app.payments.wechat-enabled=${JAVA_WECHAT_PAY_ENABLED:false}
app.payments.wechat-app-id=${JAVA_WECHAT_PAY_APP_ID:}
app.payments.wechat-merchant-id=${JAVA_WECHAT_PAY_MERCHANT_ID:}
app.payments.wechat-merchant-serial=${JAVA_WECHAT_PAY_MERCHANT_SERIAL:}
app.payments.wechat-private-key-path=${JAVA_WECHAT_PAY_PRIVATE_KEY_PATH:}
app.payments.wechat-public-key-path=${JAVA_WECHAT_PAY_PUBLIC_KEY_PATH:}
app.payments.wechat-public-key-id=${JAVA_WECHAT_PAY_PUBLIC_KEY_ID:}
app.payments.wechat-api-v3-key=${JAVA_WECHAT_PAY_API_V3_KEY:}
app.payments.wechat-notify-url=${JAVA_WECHAT_PAY_NOTIFY_URL:}
app.gifts.public-base-url=${JAVA_GIFT_PUBLIC_BASE_URL:http://127.0.0.1:8200}
app.live.host-verification-required=${JAVA_LIVE_HOST_VERIFICATION_REQUIRED:true}
app.live.host-agreement-version=${JAVA_LIVE_HOST_AGREEMENT_VERSION:2026-07}
app.live.provider=${JAVA_LIVE_PROVIDER:disabled}
app.live.mock-enabled=${JAVA_LIVE_MOCK_ENABLED:false}
app.gifts.single-limit=${JAVA_GIFT_SINGLE_LIMIT:10000}
app.gifts.daily-limit=${JAVA_GIFT_DAILY_LIMIT:20000}
app.gifts.age-verification-required=${JAVA_GIFT_AGE_VERIFICATION_REQUIRED:true}
app.gifts.confirmation-threshold=${JAVA_GIFT_CONFIRMATION_THRESHOLD:500}
