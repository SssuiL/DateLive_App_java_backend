# Same business code and storage, no HTTP listener or admin bootstrap.
spring.main.web-application-type=none
spring.datasource.hikari.maximum-pool-size=2
app.admin.bootstrap-enabled=false
app.accounts.worker-enabled=false
app.realtime.worker-enabled=false
app.media.jobs-worker-enabled=true
app.media.derivatives-worker-enabled=true
app.media.draft-worker-enabled=${JAVA_MEDIA_DRAFT_WORKER_ENABLED:true}
app.media.temp-worker-enabled=true

app.auth.legacy-registration-enabled=false
app.sms.provider=disabled
app.sms.return-dev-code=false
